<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript no head e no body</title>
</head>
<style>
    destaque{
        color: aquamarine;
        font-size: 24px;
        font-weight: bold;
    }
    
</style>

<script>
    alert("O JavaScript do cabeçalho foi executado");

</script>

<body>
    <h1>JavaScript incorporado</h1>
    
    <p>Este conteudo foi scrito diretamente no HTML!</p>

    <script>
        document.write(

            '<p class="destaque"  > Este conteudo foi criado pelo JavaScript! <p/>',
            );
        
    </script>
</body>
</html>

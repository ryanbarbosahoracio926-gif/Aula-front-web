<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de Listas</title>
</head>
<body>
    <h1>Elementos de Listas </h1>
    <p>
        As listas em HTML são utilizadas para a organizar informações
        em uma sequência.
    </p>
    <h2>Listas Ordenadas</h2>
    <ol>
        <li>Primeiro Item</li>
        <li>Segundo Item</li>
        <li>Terceiro Item</li>

            
        
    </ol>
    <h2>Listas não ordenadas</h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    
</body>
</html>

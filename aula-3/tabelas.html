<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tabela</title>
</head>
<body>
   <h1>Tabelas em HTML</h1>
   <p>
    As tabelas em HTML são usadas para <BR>
    organizar dados em linhas em coluna.
   </p> 

   <table border="1">

        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>


        </thead>


        <tbody>
            <tr>
                <td>Ryan Barbosa Horacio</td>
                <td>21</td>
                <td>Guarulhos</td>
            </tr>
            <tr>
                <td>Julio Horacio</td>
                <td>19</td>
                <td>Guarulhos</td>
            </tr>

        </tbody>
        <tbody>
            <tr>
                <td>Bruno</td>
                <td>11</td>
                <td>Guarulhos</td>
            </tr>
   </table>
</body>
</html>
